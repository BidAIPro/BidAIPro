name: Refresh official GSA vehicle snapshot

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gsa-vehicle-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out application source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the previous bounded snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if git fetch --no-tags origin refs/heads/gsa-auction-data:refs/remotes/origin/gsa-auction-data; then
            git show origin/gsa-auction-data:gsa-vehicles.json > work/previous-gsa-vehicles.json
          fi

      - name: Collect complete official vehicle data
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/export-gsa-snapshot.mjs work/gsa-vehicles.json work/previous-gsa-vehicles.json

      - name: Publish the bounded snapshot branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob="$(git hash-object -w work/gsa-vehicles.json)"
          tree="$(printf '100644 blob %s\tgsa-vehicles.json\n' "$blob" | git mktree)"
          commit="$(printf 'Refresh official GSA vehicle snapshot\n' | git commit-tree "$tree")"
          expected="$(git ls-remote --heads origin refs/heads/gsa-auction-data | cut -f1)"
          if [ -n "$expected" ]; then
            git push --force-with-lease="refs/heads/gsa-auction-data:$expected" origin "$commit:refs/heads/gsa-auction-data"
          else
            git push origin "$commit:refs/heads/gsa-auction-data"
          fi
