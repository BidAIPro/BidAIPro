name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
      - auction-data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Add the latest isolated auction snapshot
        shell: bash
        run: |
          mkdir -p data
          if git fetch origin auction-data:refs/remotes/origin/auction-data; then
            git show origin/auction-data:data/live-snapshots.js > data/live-snapshots.js
            echo "Deploying the latest auction-data snapshot with main."
          else
            bootstrap_commit=""
            while read -r candidate; do
              if git cat-file -e "$candidate:data/live-snapshots.js" 2>/dev/null; then
                bootstrap_commit="$candidate"
                break
              fi
            done < <(git rev-list --all -- data/live-snapshots.js)

            if [[ -n "$bootstrap_commit" ]]; then
              git show "$bootstrap_commit:data/live-snapshots.js" > data/live-snapshots.js
              echo "Deploying the last main-branch snapshot while auction-data initializes."
            else
              printf '%s\n' 'window.BIDAI_LIVE_SNAPSHOTS = {"observedAt":null,"lastCheckedAt":null,"sourceMode":"awaiting-first-refresh","sourceNotes":[],"items":[]};' > data/live-snapshots.js
              echo "No snapshot exists yet; deploying an empty safe snapshot."
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
