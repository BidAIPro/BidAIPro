name: Refresh authorized auction data

on:
  push:
    branches:
      - main
  schedule:
    - cron: "9 * * * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
    # One daily pass through the keyless retail-catalog allowance. Keeping this
    # separate prevents the 20-search/day free quota from being exhausted by
    # the hourly auction refresh.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Keep close-watch wakes independent from the slower catalog/research pass.
  # GitHub otherwise replaces an older pending run in the same concurrency
  # group, which previously starved hourly publication during busy periods.
  group: bidai-${{ github.event_name == 'schedule' && github.event.schedule == '2,7,12,17,22,27,32,37,42,47,52,57 * * * *' && 'near-close' || 'catalog' }}
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # A complete catalog pass can legitimately exceed 30 minutes when the
    # public marketplaces expose hundreds of detail pages. Individual source
    # failures remain isolated, but the successful sources still need enough
    # time to publish their checkpoint.
    # A complete 10,000-result discovery pass has occasionally crossed the
    # former 60-minute cutoff. Give the hourly catalog pass enough time to
    # finish and publish instead of silently losing the entire update.
    timeout-minutes: 120
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Restore the latest published snapshot
        shell: bash
        run: |
          mkdir -p data
          if git fetch --force origin refs/heads/auction-data:refs/remotes/origin/auction-data; then
            git show origin/auction-data:data/live-snapshots.js > data/live-snapshots.js
            echo "Restored the prior snapshot from the isolated auction-data branch."
          else
            bootstrap_commit=""
            while read -r candidate; do
              if git cat-file -e "$candidate:data/live-snapshots.js" 2>/dev/null; then
                bootstrap_commit="$candidate"
                break
              fi
            done < <(git rev-list --all -- data/live-snapshots.js)

            if [[ -n "$bootstrap_commit" ]]; then
              git show "$bootstrap_commit:data/live-snapshots.js" > data/live-snapshots.js
              echo "Recovered the last main-branch snapshot for the first isolated refresh."
            else
              echo "No prior snapshot exists; the collectors will create the first snapshot."
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh due auction sources
        continue-on-error: true
        # A code push should deploy quickly from the last published snapshot.
        # Full marketplace discovery stays on the hourly/manual refresh path.
        if: github.event_name != 'push'
        env:
          BIDAI_APIFY_DATASET_ID: ${{ secrets.BIDAI_APIFY_DATASET_ID }}
          BIDAI_APIFY_DATASET_IDS: ${{ secrets.BIDAI_APIFY_DATASET_IDS }}
          BIDAI_APIFY_TOKEN: ${{ secrets.BIDAI_APIFY_TOKEN }}
          BIDAI_FEED_URL: ${{ secrets.BIDAI_FEED_URL }}
          BIDAI_FEED_URLS: ${{ secrets.BIDAI_FEED_URLS }}
          BIDAI_SOURCE_CONFIG_JSON: ${{ vars.BIDAI_SOURCE_CONFIG_JSON || secrets.BIDAI_SOURCE_CONFIG_JSON }}
          BIDAI_SOURCE_AUTHORIZED: ${{ vars.BIDAI_SOURCE_CONFIG_JSON != '' && 'true' || secrets.BIDAI_SOURCE_AUTHORIZED }}
          BIDAI_WORKFLOW_SCHEDULE: ${{ github.event.schedule }}
          # Five-minute wakes may revisit known closing items only. Without an
          # explicit scope, ordinary one-hour staleness could accidentally
          # launch another full catalog crawl and starve the hourly run.
          BIDAI_REFRESH_SCOPE: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *') && 'catalog' || 'near-close' }}
          BIDAI_NORMAL_REFRESH_MINUTES: ${{ vars.BIDAI_NORMAL_REFRESH_MINUTES || '60' }}
          BIDAI_NEAR_CLOSE_REFRESH_MINUTES: ${{ vars.BIDAI_NEAR_CLOSE_REFRESH_MINUTES || '5' }}
          BIDAI_SHOPGOODWILL_ENABLED: "true"
          BIDAI_SHOPGOODWILL_CATALOG_LIMIT: "10000"
          BIDAI_SHOPGOODWILL_CATEGORY_LIMIT: "250"
          BIDAI_SHOPGOODWILL_PRIORITY_LIMIT: "200"
        run: node scripts/refresh-all-sources.mjs

      - name: Refresh supported public auction marketplaces
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        env:
          BIDAI_EBAY_CLIENT_ID: ${{ secrets.BIDAI_EBAY_CLIENT_ID }}
          BIDAI_EBAY_CLIENT_SECRET: ${{ secrets.BIDAI_EBAY_CLIENT_SECRET }}
          BIDAI_PUBLIC_SOURCE_LIMIT: "1000"
          BIDAI_PUBLIC_DETAIL_LIMIT: "250"
          BIDAI_PUBLIC_PAGE_LIMIT: "6"
        run: node scripts/refresh-public-markets.mjs

      - name: Apply agent-researched public web evidence
        continue-on-error: true
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        run: node scripts/apply-web-research.mjs

      - name: Research active items through the persistent Google Shopping queue
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        env:
          BIDAI_SERPER_API_KEY: ${{ secrets.BIDAI_SERPER_API_KEY }}
          BIDAI_SERPER_MAX_QUERIES_PER_RUN: ${{ vars.BIDAI_SERPER_MAX_QUERIES_PER_RUN || '25' }}
          BIDAI_SERPER_DELAY_MS: "300"
          BIDAI_SERPER_REFRESH_HOURS: "24"
          BIDAI_SERPER_RETRY_HOURS: "2"
        run: node scripts/enrich-serper-retail.mjs

      - name: Enrich with authorized completed-sale evidence
        continue-on-error: true
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        env:
          BIDAI_RESALE_SOURCE_AUTHORIZED: ${{ secrets.BIDAI_RESALE_SOURCE_AUTHORIZED }}
          BIDAI_RESALE_FEED_URL: ${{ secrets.BIDAI_RESALE_FEED_URL }}
          BIDAI_RESALE_FEED_TOKEN: ${{ secrets.BIDAI_RESALE_FEED_TOKEN }}
          BIDAI_RESALE_BATCH_SIZE: "500"
        run: node scripts/enrich-resale.mjs

      - name: Enrich with keyless exact-product retail references
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 5 * * *'
        env:
          BIDAI_FREE_RETAIL_BATCH_SIZE: "20"
          BIDAI_FREE_RETAIL_DELAY_MS: "31000"
        run: node scripts/enrich-free-retail.mjs

      - name: Enrich with free-account Rakuten partner retail prices
        continue-on-error: true
        # Rakuten Product Search is the high-volume current-retail tier. It is
        # a free publisher API, but it requires the publisher bearer token and
        # returns products only from partnered advertisers.
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        env:
          BIDAI_RAKUTEN_ACCESS_TOKEN: ${{ secrets.BIDAI_RAKUTEN_ACCESS_TOKEN }}
          BIDAI_RAKUTEN_RETAIL_BATCH_SIZE: "300"
          BIDAI_RAKUTEN_RETAIL_DELAY_MS: "650"
        run: node scripts/enrich-rakuten-retail.mjs

      - name: Enrich with authorized eBay Browse used asking prices
        continue-on-error: true
        # eBay retired Finding in 2025. Browse is the supported replacement and
        # requires both production client credentials; there is no fake or
        # scraped fallback when those credentials are absent.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        env:
          BIDAI_EBAY_CLIENT_ID: ${{ secrets.BIDAI_EBAY_CLIENT_ID }}
          BIDAI_EBAY_CLIENT_SECRET: ${{ secrets.BIDAI_EBAY_CLIENT_SECRET }}
          BIDAI_EBAY_MARKETPLACE_ID: "EBAY_US"
          BIDAI_EBAY_USED_BATCH_SIZE: ${{ github.event_name == 'push' && '250' || '100' }}
        run: node scripts/enrich-ebay-used.mjs

      - name: Enrich with optional paid broad-market and specialty prices
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        env:
          BIDAI_SEARCHAPI_KEY: ${{ secrets.BIDAI_SEARCHAPI_KEY }}
          BIDAI_SERPAPI_KEY: ${{ secrets.BIDAI_SERPAPI_KEY }}
          BIDAI_MARKET_PRICE_BATCH_SIZE: "200"
          BIDAI_PRICECHARTING_TOKEN: ${{ secrets.BIDAI_PRICECHARTING_TOKEN }}
          BIDAI_PRICECHARTING_BATCH_SIZE: "20"
        run: node scripts/enrich-market-prices.mjs

      - name: Build lightweight published snapshot manifest
        run: node scripts/write-snapshot-manifest.mjs

      - name: Publish changed snapshot data outside main
        shell: bash
        run: |
          test -s data/live-snapshots.js
          test -s data/snapshot-manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          export GIT_INDEX_FILE="$RUNNER_TEMP/auction-data-index"
          remote_snapshot="$RUNNER_TEMP/remote-live-snapshots.js"

          # Catalog/research and close-watch jobs intentionally run in separate
          # concurrency groups. Re-fetch and merge before every push attempt so
          # neither one can overwrite a newer bid, evidence result, history, or
          # persistent enrichment queue published by the other.
          for publish_attempt in 1 2 3 4; do
            rm -f "$remote_snapshot"
            git fetch --force origin refs/heads/auction-data:refs/remotes/origin/auction-data || true
            previous_commit="$(git rev-parse --verify origin/auction-data 2>/dev/null || true)"

            if [[ -n "$previous_commit" ]] && git cat-file -e "$previous_commit:data/live-snapshots.js" 2>/dev/null; then
              git show "$previous_commit:data/live-snapshots.js" > "$remote_snapshot"
              node scripts/merge-published-snapshots.mjs --target data/live-snapshots.js --incoming "$remote_snapshot"
            fi

            node scripts/write-snapshot-manifest.mjs
            previous_blob="$(git rev-parse --verify origin/auction-data:data/live-snapshots.js 2>/dev/null || true)"
            previous_manifest_blob="$(git rev-parse --verify origin/auction-data:data/snapshot-manifest.json 2>/dev/null || true)"
            snapshot_blob="$(git hash-object -w data/live-snapshots.js)"
            manifest_blob="$(git hash-object -w data/snapshot-manifest.json)"

            if [[ -n "$previous_blob" && "$snapshot_blob" == "$previous_blob" && -n "$previous_manifest_blob" && "$manifest_blob" == "$previous_manifest_blob" ]]; then
              echo "Authorized feed data is unchanged after the concurrent-update merge."
              exit 0
            fi

            rm -f "$GIT_INDEX_FILE"
            git read-tree --empty
            git update-index --add --cacheinfo 100644 "$snapshot_blob" data/live-snapshots.js
            git update-index --add --cacheinfo 100644 "$manifest_blob" data/snapshot-manifest.json
            snapshot_tree="$(git write-tree)"
            # Keep the high-frequency generated branch as one compact root
            # snapshot rather than retaining hundreds of large data revisions.
            # The lease plus retry loop still prevents a concurrent overwrite.
            snapshot_commit="$(printf '%s\n' 'chore(data): publish latest auction snapshots' | git commit-tree "$snapshot_tree")"

            if [[ -n "$previous_commit" ]]; then
              publish_command=(git push --force-with-lease="refs/heads/auction-data:$previous_commit" origin "$snapshot_commit:refs/heads/auction-data")
            else
              publish_command=(git push origin "$snapshot_commit:refs/heads/auction-data")
            fi
            if "${publish_command[@]}"; then
              echo "Published merged snapshot on attempt $publish_attempt."
              exit 0
            fi
            echo "Snapshot branch advanced concurrently; merging the new head and retrying ($publish_attempt/4)."
          done

          echo "Unable to publish after four concurrent-update retries." >&2
          exit 1

      - name: Verify a snapshot is available for deployment
        shell: bash
        run: |
          test -s data/live-snapshots.js
          grep -q "window.BIDAI_LIVE_SNAPSHOTS" data/live-snapshots.js

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        uses: actions/configure-pages@v5

      - name: Upload website with the refreshed snapshot
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        id: deployment
        uses: actions/deploy-pages@v4
