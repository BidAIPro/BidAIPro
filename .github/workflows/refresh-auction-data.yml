name: Refresh authorized auction data

on:
  push:
    branches:
      - main
  schedule:
    - cron: "9 * * * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bidai-refresh-and-pages
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Restore the latest published snapshot
        shell: bash
        run: |
          mkdir -p data
          if git fetch origin auction-data:refs/remotes/origin/auction-data; then
            git show origin/auction-data:data/live-snapshots.js > data/live-snapshots.js
            echo "Restored the prior snapshot from the isolated auction-data branch."
          else
            bootstrap_commit=""
            while read -r candidate; do
              if git cat-file -e "$candidate:data/live-snapshots.js" 2>/dev/null; then
                bootstrap_commit="$candidate"
                break
              fi
            done < <(git rev-list --all -- data/live-snapshots.js)

            if [[ -n "$bootstrap_commit" ]]; then
              git show "$bootstrap_commit:data/live-snapshots.js" > data/live-snapshots.js
              echo "Recovered the last main-branch snapshot for the first isolated refresh."
            else
              echo "No prior snapshot exists; the collectors will create the first snapshot."
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh due auction sources
        continue-on-error: true
        env:
          BIDAI_APIFY_DATASET_ID: ${{ secrets.BIDAI_APIFY_DATASET_ID }}
          BIDAI_APIFY_DATASET_IDS: ${{ secrets.BIDAI_APIFY_DATASET_IDS }}
          BIDAI_APIFY_TOKEN: ${{ secrets.BIDAI_APIFY_TOKEN }}
          BIDAI_FEED_URL: ${{ secrets.BIDAI_FEED_URL }}
          BIDAI_FEED_URLS: ${{ secrets.BIDAI_FEED_URLS }}
          BIDAI_SOURCE_CONFIG_JSON: ${{ vars.BIDAI_SOURCE_CONFIG_JSON || secrets.BIDAI_SOURCE_CONFIG_JSON }}
          BIDAI_SOURCE_AUTHORIZED: ${{ vars.BIDAI_SOURCE_CONFIG_JSON != '' && 'true' || secrets.BIDAI_SOURCE_AUTHORIZED }}
          BIDAI_WORKFLOW_SCHEDULE: ${{ github.event.schedule }}
          BIDAI_NORMAL_REFRESH_MINUTES: ${{ vars.BIDAI_NORMAL_REFRESH_MINUTES || '60' }}
          BIDAI_NEAR_CLOSE_REFRESH_MINUTES: ${{ vars.BIDAI_NEAR_CLOSE_REFRESH_MINUTES || '5' }}
          BIDAI_SHOPGOODWILL_ENABLED: "true"
          BIDAI_SHOPGOODWILL_CATALOG_LIMIT: "10000"
          BIDAI_SHOPGOODWILL_CATEGORY_LIMIT: "250"
          BIDAI_SHOPGOODWILL_PRIORITY_LIMIT: "200"
        run: node scripts/refresh-all-sources.mjs

      - name: Refresh supported public auction marketplaces
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        env:
          BIDAI_EBAY_CLIENT_ID: ${{ secrets.BIDAI_EBAY_CLIENT_ID }}
          BIDAI_EBAY_CLIENT_SECRET: ${{ secrets.BIDAI_EBAY_CLIENT_SECRET }}
          BIDAI_PUBLIC_SOURCE_LIMIT: "1000"
          BIDAI_PUBLIC_DETAIL_LIMIT: "250"
          BIDAI_PUBLIC_PAGE_LIMIT: "6"
        run: node scripts/refresh-public-markets.mjs

      - name: Apply agent-researched public web evidence
        continue-on-error: true
        run: node scripts/apply-web-research.mjs

      - name: Enrich with authorized completed-sale evidence
        continue-on-error: true
        env:
          BIDAI_RESALE_SOURCE_AUTHORIZED: ${{ secrets.BIDAI_RESALE_SOURCE_AUTHORIZED }}
          BIDAI_RESALE_FEED_URL: ${{ secrets.BIDAI_RESALE_FEED_URL }}
          BIDAI_RESALE_FEED_TOKEN: ${{ secrets.BIDAI_RESALE_FEED_TOKEN }}
          BIDAI_RESALE_BATCH_SIZE: "500"
        run: node scripts/enrich-resale.mjs

      - name: Enrich with matched eBay used asking prices
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        env:
          BIDAI_EBAY_CLIENT_ID: ${{ secrets.BIDAI_EBAY_CLIENT_ID }}
          BIDAI_EBAY_CLIENT_SECRET: ${{ secrets.BIDAI_EBAY_CLIENT_SECRET }}
          BIDAI_EBAY_MARKETPLACE_ID: "EBAY_US"
          BIDAI_EBAY_USED_BATCH_SIZE: "150"
        run: node scripts/enrich-ebay-used.mjs

      - name: Enrich with broad and specialty market prices
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
        env:
          BIDAI_SERPAPI_KEY: ${{ secrets.BIDAI_SERPAPI_KEY }}
          BIDAI_SERPAPI_BATCH_SIZE: "40"
          BIDAI_PRICECHARTING_TOKEN: ${{ secrets.BIDAI_PRICECHARTING_TOKEN }}
          BIDAI_PRICECHARTING_BATCH_SIZE: "20"
        run: node scripts/enrich-market-prices.mjs

      - name: Publish changed snapshot data outside main
        continue-on-error: true
        shell: bash
        run: |
          if [[ ! -f data/live-snapshots.js ]]; then
            echo "No generated snapshot file; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin auction-data:refs/remotes/origin/auction-data || true
          previous_commit="$(git rev-parse --verify origin/auction-data 2>/dev/null || true)"
          previous_blob="$(git rev-parse --verify origin/auction-data:data/live-snapshots.js 2>/dev/null || true)"
          snapshot_blob="$(git hash-object -w data/live-snapshots.js)"

          if [[ -n "$previous_blob" && "$snapshot_blob" == "$previous_blob" ]]; then
            echo "Authorized feed data is unchanged."
            exit 0
          fi

          export GIT_INDEX_FILE="$RUNNER_TEMP/auction-data-index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --empty
          git update-index --add --cacheinfo 100644 "$snapshot_blob" data/live-snapshots.js
          snapshot_tree="$(git write-tree)"

          snapshot_commit="$(printf '%s\n' 'chore(data): publish latest auction snapshots' | git commit-tree "$snapshot_tree")"
          if [[ -n "$previous_commit" ]]; then
            git push --force-with-lease="refs/heads/auction-data:$previous_commit" origin "$snapshot_commit:refs/heads/auction-data"
          else
            git push origin "$snapshot_commit:refs/heads/auction-data"
          fi

      - name: Verify a snapshot is available for deployment
        shell: bash
        run: |
          test -s data/live-snapshots.js
          grep -q "window.BIDAI_LIVE_SNAPSHOTS" data/live-snapshots.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website with the refreshed snapshot
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
